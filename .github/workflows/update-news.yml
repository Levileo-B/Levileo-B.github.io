name: 更新热点

on:
  schedule:
    # 每小时抓一次，让即时与科技快讯尽快进入首页
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取新闻源
        run: python scripts/fetch_news.py

      - name: 抓取每日一题与英文短文
        run: python scripts/fetch_daily.py
        continue-on-error: true

      - name: 抓取各地区本地新闻
        run: python scripts/fetch_local.py
        continue-on-error: true

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # 用目录，避免某个文件还没生成时 git add 直接报错中断
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore: 更新热点 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 定时任务每小时跑一次，很容易和人工推送撞上；
          # 直接 push 会被拒然后整个 job 失败，所以拉取变基后重试。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被拒绝，拉取远端后重试（第 $i 次）"
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          echo "重试 3 次仍未推送成功"
          exit 1
