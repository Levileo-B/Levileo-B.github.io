name: 更新热点

on:
  schedule:
    # 每 3 小时抓一次；源多了以后一天一次太陈旧
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取新闻源
        run: python scripts/fetch_news.py

      - name: 抓取每日一题与英文短文
        run: python scripts/fetch_daily.py
        continue-on-error: true

      - name: 抓取各地区本地新闻
        run: python scripts/fetch_local.py
        continue-on-error: true

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # 用目录，避免某个文件还没生成时 git add 直接报错中断
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交。"
          else
            git commit -m "chore: 更新热点 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
