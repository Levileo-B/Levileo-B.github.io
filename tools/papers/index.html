<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文检索 · Levileo-B</title>
<meta name="description" content="输入关键词快速检索最新科研论文，并汇总当前结果的研究方向分布。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="stylesheet" href="../../assets/style.css">
<link rel="stylesheet" href="../../assets/tools.css">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header">
  <nav class="nav" aria-label="主导航">
    <a class="nav__brand" href="../">← 工具箱</a>
    <ul class="nav__list">
      <li><a href="../../">主页</a></li>
      <li><a href="../video/">视频解析</a></li>
    </ul>
    <button class="theme-toggle" type="button" aria-label="切换深色 / 浅色模式">
      <span class="theme-toggle__icon" aria-hidden="true">◐</span>
    </button>
  </nav>
</header>

<main id="main" class="tool">

  <div class="tool__head">
    <h1 class="tool__title">论文检索</h1>
    <p class="tool__sub">输入关键词检索论文，并汇总这批结果里的研究方向分布</p>
  </div>

  <form class="form" id="form">
    <input type="search" id="q" autocomplete="off"
           placeholder="输入关键词，例如 diffusion model、蛋白质结构预测"
           aria-label="检索关键词">
    <button class="btn btn--primary" type="submit" id="go">检索</button>
  </form>

  <div class="filters">
    <label for="sort">排序</label>
    <select id="sort" class="form-select">
      <option value="publication_date:desc">最新发表</option>
      <option value="relevance_score:desc">相关度</option>
      <option value="cited_by_count:desc">被引最多</option>
    </select>
    <label for="since">时间</label>
    <select id="since">
      <option value="1">近一年</option>
      <option value="3" selected>近三年</option>
      <option value="5">近五年</option>
      <option value="0">不限</option>
    </select>
  </div>

  <div class="result" id="result" aria-live="polite">
    <p class="hint">数据来自 <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a>
      开放学术数据库，失败时自动回退到 <a href="https://www.crossref.org" target="_blank" rel="noopener">Crossref</a>。
      两者都免费、无需注册。</p>
  </div>

</main>

<footer class="site-footer">
  <p>© <span id="year">2026</span> Levileo-B · 由 GitHub Pages 托管</p>
</footer>

<script src="../../assets/main.js"></script>
<script src="app.js"></script>
</body>
</html>
